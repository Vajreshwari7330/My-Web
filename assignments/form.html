<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./form.css">
</head>
<body>
    <form>
        <div class="space">
            <label for="name">Username</label>
            <input type="text" name="Second" id="name" placeholder="Eg:Priya" minlength="5px" maxlength="10px">
        </div>
        <div class="space">
            <label for="no">Password</label>
            <input type="password" name="phone" id="no">
        </div>
        <div class="space">
            <label for="no">Age</label>
            <input type="number" name="phone" id="no">
        </div>
        <div class="space">
            <label for="no">Date of Joining</label>
            <input type="date" name="phone" id="no">
        </div>
        <div class="space">
            <label for="no">Email</label>
            <input type="email" name="phone" id="no">
        </div>
        <div class="space">
            <label for="no">Upload the file</label>
            <input type="file" name="phone" id="no">
            
            </div>
        <div class="space">
            <label>Technical skills</label>
            <input type="checkbox" name="html" id="html">
            <label for="html">HTML</label>
            <input type="checkbox" name="css" id="css">
            <label for="css">CSS</label>
            <input type="checkbox" name="js" id="js">
            <label for="js">JavaScript</label>
            
            
        </div>
        <div class="space">
            <label>Gender</label>
            <input type="radio" name="gender" id="male">
            <label for="male">Male</label>
            <input type="radio" name="gender" id="female">
            <label for="female">Female</label>

        </div>
        <div class="space"> 
            <label for="state">Select the State</label>
            <select name="select" id="select">
                <option value="disabled selected">--select the state--</option>
                <option value="">Telangana</option>
                <option value="">Karnataka</option>
                <option value="">AP</option>
                <option value="">UP</option>
            </select>
        </div>
        <div class="space">
        <label for="feed">Feedback</label>
        <textarea name="feed" id="feed" cols="40" rows="10"></textarea>
        </div>
        <div class="space">
            <button type="submit">Registration</button>
            
        </div>
    </form>
</body>
</html>
